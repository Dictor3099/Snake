<!doctype html><html lang='ru'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'><title>Snake Arena</title><link rel='stylesheet' href='style.css'></head><body>
<canvas id='game'></canvas>
<div id='hud'><canvas id='minimap' width='180' height='180'></canvas><div id='leaderboard'></div></div>
<button id='settingsBtn' class='round top'>⚙</button>
<div id='mobileControls'><div id='joystick' class='joy'><div id='stick'></div></div><button id='boost' class='boost'>⚡</button></div>
<div id='menu' class='overlay show'><div class='panel'><h1>SNAKE ARENA</h1><p>Змейка против ботов</p><label>Сложность<select id='difficulty'><option value='easy'>Лёгкая</option><option value='normal' selected>Средняя</option><option value='hard'>Сложная</option></select></label><button id='playBtn' class='primary'>Играть</button><button id='menuSettings'>Настройки</button><small>ПК: мышь / WASD • ускорение: пробел</small></div></div>
<div id='settings' class='overlay'><div class='panel settings'><h2>Настройки</h2><h3>Управление</h3><label class='check'><input id='swapControls' type='checkbox'> Поменять джойстик и ускорение местами</label><label>Размер джойстика <input id='joySize' type='range' min='90' max='160' value='120'></label><label>Прозрачность управления <input id='controlOpacity' type='range' min='25' max='100' value='70'></label><label>Чувствительность <input id='sensitivity' type='range' min='50' max='150' value='100'></label><h3>Мини-карта</h3><label class='check'><input id='mapEnabled' type='checkbox' checked> Показывать мини-карту</label><label>Размер <select id='mapSize'><option value='130'>Маленькая</option><option value='170' selected>Средняя</option><option value='210'>Большая</option></select></label><label>Прозрачность <input id='mapOpacity' type='range' min='25' max='100' value='75'></label><label class='check'><input id='showBots' type='checkbox' checked> Показывать ботов</label><label class='check'><input id='showCamera' type='checkbox' checked> Показывать область камеры</label><button id='closeSettings' class='primary'>Готово</button></div></div>
<div id='result' class='overlay'><div class='panel'><h2>Игра окончена</h2><div id='stats'></div><button id='again' class='primary'>Ещё раз</button><button id='home'>Главное меню</button></div></div>
<script src='game.js'></script></body></html>
